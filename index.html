
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel Capa FF</title>
<style>
body {
  background: #101018;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 20px;
}
.painel {
  max-width: 360px;
  margin: 30px auto;
  padding: 22px;
  border: 2px solid #ff3030;
  border-radius: 18px;
  background: #20202b;
}
h1 { color: #ff3939; }
button {
  padding: 13px;
  margin: 8px;
  border: 0;
  border-radius: 9px;
  background: #e83232;
  color: white;
  font-weight: bold;
}
input { width: 90%; }
</style>
</head>
<body>
<div class="painel">
<h1>🔥 PAINEL CAPA FF</h1>
<p>Configurações de treino</p>
<label>Sensibilidade geral</label>
<h2 id="valor">190</h2>
<input type="range" min="0" max="200" value="190"
oninput="document.getElementById('valor').textContent=this.value">
<br>
<button onclick="alert('Teste a sensibilidade no treinamento do FF!')">
TESTAR CONFIGURAÇÃO
</button>
<p>Treine a puxada de capa 🎯</p>
<small>Este painel não controla a mira do jogo.</small>
</div>
</body>
</html>
